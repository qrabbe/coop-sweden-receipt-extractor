name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo package --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-features

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private files in the tree
        run: |
          bad=$(git ls-files | grep -E '(^private/|\.coop-tokens\.json$|\.(pdf|zip)$)' || true)
          if [ -n "$bad" ]; then
            echo "Private or PDF files are tracked:"
            echo "$bad"
            exit 1
          fi
      - name: No token-like strings in the tree
        run: |
          # JWTs start with "eyJ"; BankID order references are UUIDs next to "orderRef".
          hits=$(git grep -nE 'eyJ[A-Za-z0-9_-]{20,}|orderRef"?[=:] *"?[0-9a-f]{8}-[0-9a-f]{4}-' -- . ':!.github' || true)
          if [ -n "$hits" ]; then
            echo "Possible secrets (file:line only):"
            echo "$hits" | cut -d: -f1,2
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, msrv, guard]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --features cli --target ${{ matrix.target }}
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          out="coop-receipts-${{ matrix.target }}$ext"
          cp "target/${{ matrix.target }}/release/coop-receipts$ext" "$out"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$out" --clobber
